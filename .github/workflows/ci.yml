name: Tinyscale CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      go_image: ${{ steps.plan.outputs.go_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl file jq python3-yaml shellcheck

      - name: Run tests
        run: make test

      - name: Plan target builds
        if: github.event_name != 'pull_request'
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAILSCALE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          targets=$(python3 -s tools/platforms.py list --json | jq -ce 'select(length > 0)')
          release=$(scripts/detect-release.sh)
          {
            printf 'targets=%s\n' "$targets"
            sed -n -e 's/^RELEASE_VERSION=/version=/p' \
              -e 's/^RELEASE_COMMIT=/commit=/p' \
              -e 's/^RELEASE_GO_IMAGE=/go_image=/p' <<< "$release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.id }})
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.targets) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore Go modules
        id: go-mod
        uses: actions/cache/restore@v5
        with:
          path: .cache/go-mod
          key: gomod-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.test.outputs.commit }}
          restore-keys: gomod-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go build outputs
        uses: actions/cache@v5
        with:
          path: .cache/go-build
          key: gobuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ needs.test.outputs.go_image }}-${{ needs.test.outputs.commit }}-${{ hashFiles('platforms.yml', 'scripts/**', 'overlay/**') }}
          restore-keys: gobuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-${{ needs.test.outputs.go_image }}-${{ needs.test.outputs.commit }}-

      - name: Build and validate target
        env:
          GO_IMAGE: ${{ needs.test.outputs.go_image }}
          QEMU: ${{ matrix.validation.qemu }}
          TT_BUILD_VERSION: ${{ needs.test.outputs.version }}
          TT_BUILD_COMMIT: ${{ needs.test.outputs.commit }}
          TT_TARGET_ID: ${{ matrix.id }}
          TT_TARGET_CONFIG: ${{ toJSON(matrix) }}
          TT_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/builds/project" --workdir /builds/project \
            --env QEMU --env TT_BUILD_VERSION --env TT_BUILD_COMMIT \
            --env TT_TARGET_ID --env TT_TARGET_CONFIG --env TT_UPDATE_URL \
            "$GO_IMAGE" sh -ec '
              sh scripts/ci/install-deps.sh build "$QEMU"
              exec scripts/ci/build-job.sh
            '

      - name: Save Go modules
        if: matrix.id == fromJSON(needs.test.outputs.targets)[0].id && steps.go-mod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/go-mod
          key: ${{ steps.go-mod.outputs.cache-primary-key }}

      - name: Upload validated binaries
        uses: actions/upload-artifact@v6
        with:
          name: tinyscale-build-${{ matrix.id }}
          path: dist/${{ matrix.id }}/
          if-no-files-found: error
